[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backupguard"
version = "0.1.0"
description = "Local backup manifest and integrity verification CLI tool"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff"
]

[project.scripts]
backupguard = "backupguard.cli:main"
